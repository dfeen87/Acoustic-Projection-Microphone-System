name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ created ]

env:
  BUILD_TYPE: Release

jobs:
  # Build and test on multiple platforms
  build-test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, macos-15]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        exclude:
          - os: macos-14
            compiler: gcc
          - os: macos-15
            compiler: gcc
      fail-fast: false
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          ~/Library/Caches
        key: ${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.compiler }}-
    
    - name: Install dependencies (Ubuntu)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libfftw3-dev \
          libfftw3-single3 \
          libsodium-dev \
          portaudio19-dev \
          lcov
        
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          clang_version=14
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then clang_version=18; fi
          sudo apt-get install -y "clang-$clang_version"
          echo "CC=clang-$clang_version" >> $GITHUB_ENV
          echo "CXX=clang++-$clang_version" >> $GITHUB_ENV
        else
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        fi
    
    - name: Install dependencies (macOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        brew install cmake ninja fftw libsodium portaudio
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV

    - name: Validate compiler and C++20 standard library
      run: bash scripts/validate-toolchain.sh
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DBUILD_TESTING=ON \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
    
    - name: Run tests
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --no-tests=error --output-on-failure --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
        path: build/Testing/Temporary/LastTest.log
    
    - name: Upload compile commands
      if: matrix.os == 'ubuntu-22.04' && matrix.compiler == 'gcc'
      uses: actions/upload-artifact@v4
      with:
        name: compile-commands-${{ matrix.build_type }}
        path: build/compile_commands.json


  minimal-build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgtest-dev
    - name: Build without optional dependencies
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DENABLE_LOCAL_TRANSLATION=OFF -DENABLE_ENCRYPTION=OFF -DENABLE_TFLITE=OFF
        cmake --build build --parallel 2
        ctest --test-dir build --no-tests=error --output-on-failure
        build/apm_backend --version
        python3 -O scripts/validate-test-policy.py build
        bash scripts/validate-package.sh build
        (cd build && cpack)
    - name: Configure when pkg-config is unavailable
      run: cmake -S . -B build-no-pkgconfig -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DENABLE_LOCAL_TRANSLATION=OFF -DENABLE_ENCRYPTION=OFF -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON

  backend-ui:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: |
          ui/package-lock.json
          launcher/package-lock.json
    - run: python -m pip install -r backend/requirements-dev.txt
    - name: Backend unit, API and WebSocket contracts
      run: python -m pytest backend/ -q
    - name: Build dashboard and install launcher
      run: |
        npm ci --prefix ui
        npm run build --prefix ui
        npm ci --prefix launcher
    - name: Functional launcher integration
      run: node tests/integration/integration.test.js
    - name: Verify integration runner rejects startup failure
      run: |
        broken_path=$(mktemp -d)
        ln -s "$(command -v node)" "$broken_path/node"
        if PATH="$broken_path" node tests/integration/integration.test.js; then
          echo 'ERROR: integration runner accepted failed startup'
          exit 1
        fi

  # Code coverage
  coverage:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libfftw3-dev \
          lcov
    
    - name: Configure with coverage
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTING=ON \
          -DENABLE_COVERAGE=ON
    
    - name: Build
      run: cmake --build build -j$(nproc)
    
    - name: Check if tests were built
      run: |
        echo "=== Checking build directory ==="
        ls -la build/
        echo "=== Looking for test executables ==="
        find build -type f -executable -name "*test*" || echo "No test executables found"
        echo "=== Looking for .gcno files (should exist after build) ==="
        find build -name "*.gcno" || echo "No .gcno files found"
    
    - name: Run tests to generate coverage data
      working-directory: build
      run: |
        echo "=== Running CTest ==="
        ctest --no-tests=error --output-on-failure --verbose
    
    - name: Verify coverage files exist
      run: |
        echo "Checking for .gcda files..."
        find build -name "*.gcda" -type f
        if [ -z "$(find build -name '*.gcda' -type f)" ]; then
          echo "ERROR: No .gcda files found!"
          exit 1
        fi
    
    - name: Generate coverage report
      run: |
        lcov --capture --directory build --output-file coverage.info
        lcov --remove coverage.info \
          '/usr/*' \
          '*/tests/*' \
          '*/external/*' \
          '*/build/_deps/*' \
          '*/googletest-src/*' \
          --output-file coverage.info
        lcov --list coverage.info
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true

  # Static analysis
  static-analysis:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang-tidy-14 \
          cppcheck \
          cmake \
          libfftw3-dev
    
    - name: Configure
      run: cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    
    - name: Run clang-tidy
      run: |
        clang-tidy-14 -p build src/*.cpp -- -std=c++20 || true
    
    - name: Run cppcheck
      run: |
        cppcheck --enable=all --inconclusive --std=c++20 \
          --suppress=missingIncludeSystem \
          --suppress=unmatchedSuppression \
          -I include src/ 2>&1 | tee cppcheck-report.txt
    
    - name: Upload analysis results
      uses: actions/upload-artifact@v4
      with:
        name: static-analysis-results
        path: cppcheck-report.txt

  # Sanitizers
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]
        include:
          - sanitizer: address
            flags: -fsanitize=address
          - sanitizer: undefined
            flags: -fsanitize=undefined,float-cast-overflow
          - sanitizer: thread
            flags: -fsanitize=thread
    
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libfftw3-dev
    
    - name: Configure with ${{ matrix.sanitizer }} sanitizer
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }} -fno-omit-frame-pointer"
    
    - name: Build
      run: cmake --build build -j$(nproc)
    
    - name: Run tests
      working-directory: build
      run: ctest --no-tests=error --output-on-failure
      env:
        ASAN_OPTIONS: detect_leaks=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  # Benchmark
  benchmark:
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libfftw3-dev
    
    - name: Configure
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_BENCHMARKS=ON
    
    - name: Build
      run: cmake --build build -j$(nproc)
    
    - name: Run benchmarks
      run: |
        python3 -O scripts/validate-test-policy.py build
        ctest --test-dir build --no-tests=error -L performance --output-on-failure --parallel 1
    
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: build/Testing/Temporary/LastTest.log

  # Documentation
  documentation:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Doxygen
      run: sudo apt-get install -y doxygen graphviz
    
    - name: Generate documentation
      run: |
        doxygen Doxyfile || echo "Doxyfile not found, skipping"
    
    - name: Check generated documentation
      id: docs
      run: |
        if [ -f docs/html/index.html ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

    - name: Deploy to GitHub Pages
      if: steps.docs.outputs.exists == 'true' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/html

  # Docker build
  docker-context:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Verify Docker context excludes local secrets
      run: bash scripts/validate-docker-context.sh

  docker:
    needs: [build-test, minimal-build, backend-ui, coverage, sanitizers, docker-context]
    runs-on: ubuntu-22.04
    env:
      DOCKER_TAG: ${{ github.sha }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      if: github.event_name == 'release' && env.DOCKER_PASSWORD != ''
      uses: docker/login-action@v3
      with:
        username: dfeen87
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        load: true
        push: false
        tags: |
          apm-system:ci
          dfeen87/apm-system:latest
          dfeen87/apm-system:${{ env.DOCKER_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify container API, authorization and persistence
      run: bash scripts/validate-docker-runtime.sh apm-system:ci

    - name: Publish validated release image
      if: github.event_name == 'release' && env.DOCKER_PASSWORD != ''
      run: |
        docker push dfeen87/apm-system:latest
        docker push "dfeen87/apm-system:$DOCKER_TAG"

  # Release
  release:
    permissions:
      contents: write
    if: github.event_name == 'release'
    needs: [build-test, minimal-build, backend-ui, coverage, static-analysis, sanitizers]
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libfftw3-dev
    
    - name: Build release
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
        cmake --build build -j$(nproc)
        bash scripts/validate-package.sh build
        cd build && cpack
    
    - name: Upload release artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: ./build/apm-*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
